  <!-- cells with values -->
  <rect x="172" y="100" width="76" height="16" rx="3" fill="#e63946" opacity="0.75"/>
  <rect x="272" y="100" width="56" height="16" rx="3" fill="#cfd8e3"/>
  <rect x="172" y="130" width="60" height="16" rx="3" fill="#1a7f4e" opacity="0.75"/>
